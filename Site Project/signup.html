<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام | قنادی آنلاین</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>ثبت‌نام در قنادی آنلاین</h1>
  <form action="signup-success.html" method="post">
    <label for="fullname">نام کامل:</label><br>
    <input type="text" id="fullname" name="fullname" required><br><br>

    <label for="email">ایمیل:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">رمز عبور:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <label for="confirm">تکرار رمز عبور:</label><br>
    <input type="password" id="confirm" name="confirm" required><br><br>

    <button type="submit">ثبت‌نام</button>
  </form>

  <p>قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">ورود</a></p>
  <p>رمز عبور خود را فراموش کرده‌اید؟ <a href="forgot.html">بازیابی رمز عبور</a></p>

</body>
</html>
