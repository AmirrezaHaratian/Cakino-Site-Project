<body>

  <h1>بازیابی رمز عبور</h1>
  <p>رمز جدید خود را وارد کنید.</p>

  <form action="login.html" method="post">
    <label for="newpass">رمز جدید:</label><br>

    <label for="confirmpass">تکرار رمز جدید:</label><br>
    <input type="password" id="confirmpass" name="confirmpass" required><br><br>

    <button type="submit">ذخیره رمز جدید</button>
  </form>

</body>
