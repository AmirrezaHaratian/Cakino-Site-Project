<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تنظیمات کاربر</title>
  <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components/switch.css">
  <link rel="stylesheet" href="css/components/switch.css">
  <script defer src="js/ui.js"></script>
</head>
<body>

<h2>تنظیمات شخصی‌سازی نرم‌افزار</h2>

<section class="settings-group">

  <div class="setting-item">
    <label class="md-switch">
      <input type="checkbox" id="darkMode">
      <span class="track"></span>
      <span class="thumb"></span>
    </label>
    <span>حالت تیره (Dark Mode)</span>
  </div>

  <div class="setting-item">
    <label class="md-switch">
      <input type="checkbox" checked>
      <span class="track"></span>
      <span class="thumb"></span>
    </label>
    <span>اعلان سفارش‌ها</span>
  </div>

  <div class="setting-item">
    <label class="md-switch">
      <input type="checkbox" disabled>
      <span class="track"></span>
      <span class="thumb"></span>
    </label>
    <span>اعلان پیامکی (غیرفعال)</span>
  </div>

  <div class="setting-item">
    <label class="md-switch">
      <input type="checkbox">
      <span class="track"></span>
      <span class="thumb"></span>
    </label>
    <span>ذخیره اطلاعات ارسال</span>
  </div>

</section>

</body>
</html>
